<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM Admin Panel</title>
    <style>
        body {
            background-color: #0b0713;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: #130d22;
            border: 1px solid #2d1b4e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 24px;
            color: #bb86fc;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #8a7aab;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            background: #1b1230;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #3d2766;
            margin-bottom: 30px;
        }
        label {
            color: #e0d4f7;
            font-size: 14px;
        }
        select {
            background: #0b0713;
            color: #fff;
            border: 1px solid #52348c;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
        }
        button {
            background: #6200ee;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #7f39fb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #130d22;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #2d1b4e;
            font-size: 14px;
        }
        th {
            color: #8a7aab;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background: rgba(98, 0, 238, 0.05);
        }
        .key-style {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            color: #cf6679;
            background: #25163a;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .online-badge {
            color: #03dac6;
            font-weight: bold;
        }
        .offline-badge {
            color: #666666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RAVGE PREMIUM CONTROL</h1>
    <p class="subtitle">Разработано ForTrilogy | Полное управление Neon БД</p>

    <div class="control-panel">
        <label for="duration">🔑 Создать ключ на:</label>
        <select id="duration">
            <option value="7d">7 дней</option>
            <option value="15d">15 дней</option>
            <option value="30d">30 дней</option>
        </select>
        <button onclick="generateKey()">+ Сгенерировать ключ</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Лицензионный ключ</th>
                <th>Пользователь (Логин)</th>
                <th>HWID привязка</th>
                <th>Сервер</th>
                <th>Окончание подписки</th>
                <th>Статус</th>
            </tr>
        </thead>
        <tbody id="license-table">
            <tr>
                <td colspan="7" style="text-align: center; color: #8a7aab; padding: 30px;">Загрузка данных...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // Функция создания ключа
    async function generateKey() {
        const durationElement = document.getElementById('duration');
        const durationValue = durationElement ? durationElement.value : '30d';

        try {
            const response = await fetch('/api/admin/generate-license', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: 'coco2012coco!', // Сверяется с сервером
                    duration: durationValue
                })
            });

            const data = await response.json();

            if (data.success) {
                alert(`Ключ успешно создан и сохранен!\n\n${data.key}`);
                loadLicenses(); // Обновляем таблицу на экране
            } else {
                alert(`Ошибка: ${data.error || 'Не удалось сгенерировать ключ'}`);
            }
        } catch (err) {
            console.error(err);
            alert('Сетевая ошибка при генерации ключа');
        }
    }

    // Функция загрузки списка ключей
    async function loadLicenses() {
        try {
            const response = await fetch('/api/admin/keys');
            const data = await response.json();

            const tableBody = document.getElementById('license-table');
            if (!tableBody) return;

            tableBody.innerHTML = '';

            const licenses = data.licenses || [];

            if (licenses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #8a7aab; padding: 30px;">Ключей в базе данных не обнаружено</td></tr>`;
                return;
            }

            licenses.forEach(lic => {
                const row = document.createElement('tr');
                
                const formattedDate = lic.expires_at 
                    ? new Date(lic.expires_at).toLocaleString('ru-RU') 
                    : 'Бессрочно';

                const isOnline = lic.last_server && lic.last_server !== 'Оффлайн';
                const statusHtml = isOnline 
                    ? `<span class="online-badge">● В игре</span>` 
                    : `<span class="offline-badge">● Оффлайн</span>`;

                row.innerHTML = `
                    <td>${lic.id}</td>
                    <td><span class="key-style">${lic.license_key}</span></td>
                    <td>${lic.last_name || '—'}</td>
                    <td style="font-size: 12px; color: #a497c2;">${lic.hwid || 'Не привязан'}</td>
                    <td>${lic.last_server || '—'}</td>
                    <td>${formattedDate}</td>
                    <td>${statusHtml}</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            console.error('Ошибка загрузки данных:', err);
        }
    }

    // Запуск автообновления таблицы каждые 10 секунд
    document.addEventListener('DOMContentLoaded', () => {
        loadLicenses();
        setInterval(loadLicenses, 10000);
    });
</script>

</body>
</html>
