<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM CONTROL v2.2</title>
    <style>
        :root {
            --bg-main: #0a0516;
            --bg-card: #120924;
            --bg-input: #1a0f33;
            --primary: #8a2be2;
            --primary-hover: #9d4edd;
            --accent-green: #00f5d4;
            --accent-red: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a497c2;
            --border: #2e1a4e;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        /* ФИКС: Экран логина теперь растягивается строго на весь экран, убирая белые/серые куски */
        #login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-screen {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
        }
        #main-panel-wrapper {
            padding: 30px;
            display: flex;
            justify-content: center;
            min-height: 100%;
            background-color: var(--bg-main);
        }
        .container {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 35px;
        }
        .control-panel {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #170d2e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #3c1e6d;
            margin-bottom: 35px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        select, input {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid #4a2785;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            transition: border 0.2s;
        }
        select:focus, input:focus {
            border-color: var(--primary-hover);
        }
        button {
            background: linear-gradient(135deg, var(--primary), #5b00b3);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        tr:hover {
            background: rgba(138, 43, 226, 0.04);
        }
        .key-style {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            color: #e0aaff;
            background: #24123a;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #43236a;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-online { background: rgba(0, 245, 212, 0.1); color: var(--accent-green); }
        .badge-menu { background: rgba(138, 43, 226, 0.1); color: #b577ff; }
        .badge-offline { background: rgba(255, 255, 255, 0.05); color: #888; }
        .badge-banned { background: rgba(255, 0, 127, 0.1); color: var(--accent-red); }
        
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-small {
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 6px;
        }
        .btn-ban { background: #3a001c; color: var(--accent-red); border: 1px solid var(--accent-red); }
        .btn-ban:hover { background: var(--accent-red); color: #000; }
        .btn-unban { background: #003a30; color: var(--accent-green); border: 1px solid var(--accent-green); }
        .btn-unban:hover { background: var(--accent-green); color: #000; }
        .btn-extend { background: #22173d; color: #fff; border: 1px solid var(--primary); }
        .btn-delete { background: #2b000a; color: #ff3366; border: 1px solid #ff3366; }
        .btn-delete:hover { background: #ff3366; color: #000; }
    </style>
</head>
<body>

<!-- ПОЛНОЭКРАННЫЙ ЭКРАН АВТОРИЗАЦИИ -->
<div id="login-wrapper">
    <div id="login-screen">
        <h1>RAVGE LOGIN</h1>
        <p class="subtitle">Введите мастер-пароль панели</p>
        <div class="input-group" style="margin-bottom: 20px;">
            <input type="password" id="admin-pass" placeholder="Пароль администратора...">
        </div>
        <button onclick="login()" style="width: 100%;">Войти</button>
    </div>
</div>

<!-- ОСНОВНАЯ ПАНЕЛЬ С КЛЮЧАМИ -->
<div id="main-panel-wrapper" style="display: none;">
    <div class="container">
        <h1>RAVGE PREMIUM CONTROL</h1>
        <p class="subtitle">Панель управления лицензиями • Разработчик ForTrilogy</p>

        <div class="control-panel">
            <div class="input-group">
                <label>Пользователь (Логин)</label>
                <input type="text" id="username" placeholder="Пример: admin_test">
            </div>
            <div class="input-group">
                <label>Срок действия</label>
                <select id="duration">
                    <option value="7d">7 дней</option>
                    <option value="15d">15 дней</option>
                    <option value="30d">30 дней</option>
                </select>
            </div>
            <button onclick="generateKey()" style="margin-top: 16px;">+ Создать лицензию</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Лицензионный ключ</th>
                    <th>Логин (Веб)</th>
                    <th>Ник в Minecraft</th>
                    <th>HWID привязка</th>
                    <th>Текущий Сервер</th>
                    <th>Окончание подписки</th>
                    <th>Действия / Продление / Удаление</th>
                </tr>
            </thead>
            <tbody id="license-table">
                <tr>
                    <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Синхронизация данных...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let sessionPassword = '';

    function login() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'coco2012coco!') {
            sessionPassword = pass;
            document.getElementById('login-wrapper').style.display = 'none';
            document.getElementById('main-panel-wrapper').style.display = 'flex';
            loadLicenses();
            setInterval(loadLicenses, 5000); // Обновление каждые 5 сек
        } else {
            alert('Неверный мастер-пароль панели!');
        }
    }

    async function generateKey() {
        const loginVal = document.getElementById('username').value.trim() || '—';
        const durationVal = document.getElementById('duration').value;

        try {
            const response = await fetch('/api/admin/generate-license', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, duration: durationVal, login: loginVal })
            });
            const data = await response.json();
            if (data.success) {
                alert(`Лицензия создана!\nКлюч: ${data.key}`);
                loadLicenses();
            } else { alert(`Ошибка: ${data.error}`); }
        } catch (err) { alert('Ошибка соединения с базой.'); }
    }

    async function toggleBan(key, currentBanStatus) {
        try {
            const response = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key, ban: !currentBanStatus })
            });
            const data = await response.json();
            if (data.success) loadLicenses();
        } catch (e) { console.error(e); }
    }

    async function extendKey(key, selectId) {
        const duration = document.getElementById(selectId).value;
        try {
            const response = await fetch('/api/admin/extend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key, duration: duration })
            });
            const data = await response.json();
            if (data.success) { alert('Время успешно добавлено к лицензии!'); loadLicenses(); }
        } catch (e) { console.error(e); }
    }

    async function deleteKey(key) {
        if (!confirm('Вы уверены, что хотите НАВСЕГДА удалить этот ключ из базы данных?')) return;
        
        try {
            const response = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key })
            });
            const data = await response.json();
            if (data.success) {
                loadLicenses();
            } else {
                alert(`Ошибка удаления: ${data.error}`);
            }
        } catch (e) { console.error(e); }
    }

    async function loadLicenses() {
        try {
            const response = await fetch('/api/admin/keys');
            const data = await response.json();
            const tableBody = document.getElementById('license-table');
            if (!tableBody) return;
            tableBody.innerHTML = '';

            (data.licenses || []).forEach(lic => {
                const row = document.createElement('tr');
                const expireDate = lic.expires_at ? new Date(lic.expires_at).toLocaleString('ru-RU') : 'Истекла';
                
                let serverBadge = `<span class="badge badge-offline">Оффлайн</span>`;
                if (lic.is_banned) {
                    serverBadge = `<span class="badge badge-banned">Забанен</span>`;
                } else if (lic.last_server === 'В меню') {
                    serverBadge = `<span class="badge badge-menu">В меню</span>`;
                } else if (lic.last_server && lic.last_server !== 'Оффлайн') {
                    serverBadge = `<span class="badge badge-online">${lic.last_server}</span>`;
                }

                const banBtn = lic.is_banned 
                    ? `<button class="btn-small btn-unban" onclick="toggleBan('${lic.license_key}', true)">Разбанить</button>`
                    : `<button class="btn-small btn-ban" onclick="toggleBan('${lic.license_key}', false)">Забанить</button>`;

                const selectId = `extend-${lic.id}`;

                row.innerHTML = `
                    <td>${lic.id}</td>
                    <td><span class="key-style">${lic.license_key}</span></td>
                    <td style="font-weight: bold; color: #fff;">${lic.web_login || '—'}</td>
                    <td style="color: #00f5d4; font-weight: 500;">${lic.last_name || '—'}</td>
                    <td style="font-size: 11px; font-family: monospace; color: var(--text-muted);">${lic.hwid || 'Свободно'}</td>
                    <td>${serverBadge}</td>
                    <td>${expireDate}</td>
                    <td>
                        <div class="action-btns">
                            ${banBtn}
                            <select id="${selectId}" style="padding: 6px; font-size: 12px; background: #251842;">
                                <option value="7d">+7д</option>
                                <option value="15d">+15д</option>
                                <option value="30d">+30д</option>
                            </select>
                            <button class="btn-small btn-extend" onclick="extendKey('${lic.license_key}', '${selectId}')">Продлить</button>
                            <button class="btn-small btn-delete" onclick="deleteKey('${lic.license_key}')">Удалить</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) { console.error(err); }
    }
</script>
</body>
</html>
