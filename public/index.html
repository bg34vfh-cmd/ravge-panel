<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диагностика параметров браузера</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        .results {
            display: none;
            margin-top: 24px;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 20px;
        }
        .greeting {
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 16px;
        }
        .info-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .info-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
        }
        .info-label {
            color: #94a3b8;
        }
        .info-value {
            color: #f1f5f9;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
        }
        .notice {
            margin-top: 16px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Как тебя зовут?</h1>
    <p class="subtitle">Введите имя, чтобы проверить локальные параметры вашего браузера</p>

    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Ваше имя..." autocomplete="off">
        <button onclick="showDiagnostics()">Показать</button>
    </div>

    <div class="results" id="resultsBlock">
        <div class="greeting" id="greetingText"></div>
        <ul class="info-list" id="infoList"></ul>
        <p class="notice">Все данные получены локально через Web API и никуда не отправляются.</p>
    </div>
</div>

<script>
    function getGPUInfo() {
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return 'Не поддерживается';
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            return debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : 'Скрыто браузером';
        } catch (e) {
            return 'Недоступно';
        }
    }

    function showDiagnostics() {
        const nameInput = document.getElementById('usernameInput').value.trim();
        const name = nameInput ? nameInput : 'Гость';

        document.getElementById('greetingText').textContent = `Привет, ${name}! Вот параметры вашего устройства:`;

        const data = [
            { label: 'Платформа / ОС', value: navigator.platform || 'Не определено' },
            { label: 'Язык системы', value: navigator.language || 'Не определено' },
            { label: 'Часовой пояс', value: Intl.DateTimeFormat().resolvedOptions().timeZone },
            { label: 'Локальное время', value: new Date().toLocaleTimeString() },
            { label: 'Разрешение экрана', value: `${window.screen.width} × ${window.screen.height}` },
            { label: 'Окно браузера', value: `${window.innerWidth} × ${window.innerHeight}` },
            { label: 'Глубина цвета', value: `${window.screen.colorDepth} бит` },
            { label: 'Потоки процессора', value: navigator.hardwareConcurrency ? `${navigator.hardwareConcurrency} ядер` : 'Скрыто' },
            { label: 'Оперативная память', value: navigator.deviceMemory ? `~${navigator.deviceMemory} ГБ` : 'Скрыто' },
            { label: 'Видеокарта (WebGL)', value: getGPUInfo() },
            { label: 'Cookies включены', value: navigator.cookieEnabled ? 'Да' : 'Нет' },
            { label: 'User-Agent', value: navigator.userAgent }
        ];

        const list = document.getElementById('infoList');
        list.innerHTML = '';

        data.forEach(item => {
            const li = document.createElement('li');
            li.className = 'info-item';
            li.innerHTML = `<span class="info-label">${item.label}</span><span class="info-value">${item.value}</span>`;
            list.appendChild(li);
        });

        document.getElementById('resultsBlock').style.display = 'block';
    }

    document.getElementById('usernameInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            showDiagnostics();
        }
    });
</script>

</body>
</html>
