<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM Admin Panel</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #0a0a0f 0%, #0f0f1a 50%, #0a0a15 100%);
            min-height: 100vh;
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(88, 28, 135, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container { 
            width: 100%; 
            max-width: 1400px; 
            background: linear-gradient(135deg, rgba(18, 18, 23, 0.95), rgba(20, 20, 30, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 20px; 
            border: 1px solid rgba(88, 28, 135, 0.3);
            padding: 40px; 
            box-shadow: 
                0 0 40px rgba(88, 28, 135, 0.2),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        
        h1 { 
            font-size: 42px; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc 0%, #a855f7 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
        }
        
        h1 span { 
            color: #a855f7;
            -webkit-text-fill-color: #a855f7;
        }
        
        .subtitle { 
            color: #71717a; 
            font-size: 14px; 
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .generator-block { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background: linear-gradient(135deg, rgba(22, 22, 34, 0.8), rgba(30, 30, 45, 0.8));
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 30px; 
            border: 1px solid rgba(88, 28, 135, 0.3);
            flex-wrap: wrap;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .generator-label {
            font-size: 16px; 
            font-weight: 700; 
            color: #c084fc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .generator-label::before {
            content: '🔑';
            font-size: 20px;
        }
        
        select, input { 
            background: rgba(28, 28, 40, 0.8); 
            color: #fff; 
            border: 1px solid rgba(88, 28, 135, 0.5); 
            padding: 12px 16px; 
            border-radius: 10px; 
            font-size: 14px; 
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        select:hover, input:hover {
            border-color: rgba(168, 85, 247, 0.7);
            background: rgba(30, 30, 50, 0.9);
        }
        
        select:focus, input:focus { 
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }
        
        .btn { 
            background: linear-gradient(135deg, #581c87, #7024ab); 
            color: #fff; 
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 12px 28px; 
            font-size: 14px; 
            font-weight: 700; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(88, 28, 135, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover { 
            background: linear-gradient(135deg, #7024ab, #8b34cc);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(88, 28, 135, 0.6);
            border-color: rgba(168, 85, 247, 0.6);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .table-container { 
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(88, 28, 135, 0.2);
            background: rgba(20, 20, 28, 0.6);
            backdrop-filter: blur(10px);
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
        }
        
        thead {
            background: linear-gradient(135deg, rgba(24, 24, 32, 0.9), rgba(28, 28, 38, 0.9));
        }
        
        th, td { 
            padding: 16px 18px; 
            font-size: 13px; 
            vertical-align: middle; 
        }
        
        th { 
            color: #a1a1aa; 
            font-weight: 700; 
            text-transform: uppercase; 
            font-size: 11px; 
            letter-spacing: 1.5px;
            border-bottom: 2px solid rgba(88, 28, 135, 0.3);
        }
        
        tbody tr {
            border-bottom: 1px solid rgba(31, 31, 46, 0.5);
            transition: all 0.3s ease;
        }
        
        tbody tr:hover { 
            background: linear-gradient(135deg, rgba(27, 27, 38, 0.8), rgba(30, 30, 44, 0.8));
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .status { 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: 700; 
            display: inline-block;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .status.active { 
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.1));
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }
        
        .status.banned { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        
        .badge { 
            background: linear-gradient(135deg, rgba(39, 39, 42, 0.8), rgba(45, 45, 52, 0.8));
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            color: #d4d4d8;
            font-weight: 600;
            border: 1px solid rgba(63, 63, 70, 0.5);
        }
        
        .action-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            flex-wrap: wrap;
        }
        
        .action-btn { 
            background: none; 
            border: 1px solid #3f3f46; 
            color: #a1a1aa; 
            padding: 8px 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
            backdrop-filter: blur(5px);
        }
        
        .action-btn.ban { 
            border-color: rgba(239, 68, 68, 0.5); 
            color: #f87171;
            background: rgba(239, 68, 68, 0.05);
        }
        .action-btn.ban:hover { 
            background: linear-gradient(135deg, #dc2626, #ef4444); 
            color: #fff;
            border-color: #ef4444;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            transform: translateY(-1px);
        }
        
        .action-btn.unban { 
            border-color: rgba(34, 197, 94, 0.5); 
            color: #4ade80;
            background: rgba(34, 197, 94, 0.05);
        }
        .action-btn.unban:hover { 
            background: linear-gradient(135deg, #16a34a, #22c55e); 
            color: #fff;
            border-color: #22c55e;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transform: translateY(-1px);
        }
        
        .action-btn.del { 
            border-color: rgba(113, 113, 122, 0.5); 
            color: #e4e4e7;
            background: rgba(113, 113, 122, 0.05);
        }
        .action-btn.del:hover { 
            background: linear-gradient(135deg, #991b1b, #dc2626); 
            color: #fff; 
            border-color: #ef4444;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            transform: translateY(-1px);
        }
        
        .action-btn.ext { 
            border-color: rgba(168, 85, 247, 0.5); 
            color: #c084fc; 
            font-weight: 700;
            background: rgba(168, 85, 247, 0.05);
        }
        .action-btn.ext:hover { 
            background: linear-gradient(135deg, #7c3aed, #a855f7); 
            color: #fff;
            border-color: #a855f7;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }
        
        .time { 
            font-family: 'Courier New', monospace; 
            color: #c084fc; 
            font-weight: 700;
            background: rgba(168, 85, 247, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .hwid-text { 
            font-family: 'Courier New', monospace; 
            font-size: 11px; 
            color: #71717a; 
            max-width: 130px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
            background: rgba(113, 113, 122, 0.05);
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        .server-status {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .server-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .server-dot.online {
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }
        
        .server-dot.offline {
            background: #71717a;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        select[id^="ext-select-"] {
            padding: 6px 10px;
            font-size: 12px;
            background: rgba(28, 28, 40, 0.8);
            border-radius: 8px;
        }
        
        input[id^="ext-custom-"] {
            padding: 6px 10px;
            font-size: 12px;
            width: 100px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>RAVGE <span>PREMIUM</span> CONTROL</h1>
        <div class="subtitle">⚡ Разработчик: Forthbxr | Полное управление Neon БД</div>
    </div>
    
    <div class="generator-block">
        <span class="generator-label">Создать ключ на:</span>
        <select id="gen-time-select" onchange="toggleCustomInput('gen-time-select', 'gen-custom-time')">
            <option value="7d">7 дней</option>
            <option value="15d">15 дней</option>
            <option value="30d" selected>30 дней</option>
            <option value="custom">Кастомное время...</option>
        </select>
        <input type="text" id="gen-custom-time" placeholder="Пример: 5 мин, 2 час, 1 д" style="display: none; width: 220px;">
        <button class="btn" onclick="generateKey()">⚡ Сгенерировать ключ</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Лицензионный Ключ</th>
                    <th>Пользователь (Логин)</th>
                    <th>HWID привязка</th>
                    <th>Сервер</th>
                    <th>Окончание подписки</th>
                    <th>Статус</th>
                    <th>Действия управления</th>
                </tr>
            </thead>
            <tbody id="keys-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    function toggleCustomInput(selectId, inputId) {
        const select = document.getElementById(selectId);
        const input = document.getElementById(inputId);
        input.style.display = select.value === 'custom' ? 'inline-block' : 'none';
    }

    async function sendRequest(url, body = null) {
        const options = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
        const res = await fetch(url, options);
        return await res.json();
    }

    async function loadKeys() {
        try {
            const data = await sendRequest('/api/admin/keys');
            if (!data.success) return;

            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = '';

            data.keys.forEach(item => {
                const tr = document.createElement('tr');
                let expiresStr = item.expires_at > 0 ? new Date(Number(item.expires_at)).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'Не активирован';
                let userDisplay = item.player_name || '—';
                if (item.login) userDisplay += ` <span style="color: #a855f7; font-size: 12px; font-weight:bold;">(${item.login})</span>`;
                
                // Определяем статус сервера для индикатора
                let serverStatus = '—';
                let serverDotClass = '';
                if (item.server_ip === 'Офлайн' || item.server_ip === '—') {
                    serverDotClass = 'offline';
                    serverStatus = item.server_ip || '—';
                } else if (item.server_ip === 'В меню' || item.server_ip === 'В главном меню') {
                    serverDotClass = 'online';
                    serverStatus = item.server_ip;
                } else if (item.server_ip && item.server_ip !== '—') {
                    serverDotClass = 'online';
                    serverStatus = item.server_ip;
                }

                tr.innerHTML = `
                    <td><span class="badge">#${item.id}</span></td>
                    <td style="font-weight: bold; color: #fff;">${item.key}</td>
                    <td style="color: #60a5fa; font-weight: 500;">${userDisplay}</td>
                    <td><div class="hwid-text" title="${item.hwid || 'Нет'}">${item.hwid || '—'}</div></td>
                    <td>
                        <div class="server-status">
                            ${serverDotClass ? `<span class="server-dot ${serverDotClass} ${serverDotClass === 'online' ? 'animate-pulse' : ''}"></span>` : ''}
                            <span style="color: #fbbf24; font-size: 12px;">${serverStatus}</span>
                        </div>
                    </td>
                    <td class="time">${expiresStr}</td>
                    <td><span class="status ${item.status}">${item.status === 'active' ? 'ACTIVE' : 'BANNED'}</span></td>
                    <td>
                        <div class="action-container">
                            <select id="ext-select-${item.id}" style="padding: 5px; font-size: 12px;" onchange="toggleCustomInput('ext-select-${item.id}', 'ext-custom-${item.id}')">
                                <option value="1h">1 час</option>
                                <option value="1d">1 день</option>
                                <option value="7d">7 дней</option>
                                <option value="30d" selected>30 дней</option>
                                <option value="custom">Кастом...</option>
                            </select>
                            <input type="text" id="ext-custom-${item.id}" placeholder="1 мин / 5 час" style="display: none; padding: 5px; font-size: 12px; width: 90px;">
                            <button class="action-btn ext" onclick="extendKey(${item.id})">➕ Продлить</button>
                            <button class="action-btn ${item.status === 'active' ? 'ban' : 'unban'}" onclick="toggleStatus(${item.id})">${item.status === 'active' ? 'Бан' : 'Разбан'}</button>
                            <button class="action-btn del" onclick="deleteKey(${item.id})">Удалить</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) { console.error(e); }
    }

    async function generateKey() {
        const select = document.getElementById('gen-time-select');
        const customInput = document.getElementById('gen-custom-time');
        const timeValue = select.value === 'custom' ? customInput.value : select.value;
        const data = await sendRequest('/api/admin/generate-license', { timeInput: timeValue });
        if (data.success) { customInput.value = ''; loadKeys(); } else alert("Ошибка: " + data.error);
    }

    async function extendKey(id) {
        const select = document.getElementById(`ext-select-${id}`);
        const customInput = document.getElementById(`ext-custom-${id}`);
        const timeValue = select.value === 'custom' ? customInput.value : select.value;
        const data = await sendRequest('/api/admin/extend', { id, timeInput: timeValue });
        if (data.success) loadKeys(); else alert("Ошибка: " + data.error);
    }

    async function toggleStatus(id) {
        const data = await sendRequest('/api/admin/toggle-status', { id });
        if (data.success) loadKeys();
    }

    async function deleteKey(id) {
        if (confirm("Удалить этот ключ из базы?")) {
            const data = await sendRequest('/api/admin/delete', { id });
            if (data.success) loadKeys();
        }
    }

    loadKeys();
    setInterval(loadKeys, 4000);
</script>
</body>
</html>
