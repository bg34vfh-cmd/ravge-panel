<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM CONTROL v2.2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-main: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-input: #242424;
            --primary: #00d4ff;
            --primary-hover: #33e0ff;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --text-main: #f5f5f5;
            --text-muted: #9e9e9e;
            --border: #333333;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 230, 118, 0.03) 0%, transparent 50%);
        }
        body {
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            padding: 30px;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            align-self: flex-start;
            backdrop-filter: blur(10px);
        }
        #login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            background-image: 
                radial-gradient(ellipse at center, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #login-screen {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: var(--bg-card);
            padding: 50px 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.9);
        }
        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 40px;
            letter-spacing: 0.3px;
        }
        .control-panel {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #3a3a3a;
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        select, input {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid #444;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.25s ease;
            box-sizing: border-box;
            height: 48px;
        }
        select:focus, input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        button {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0f0f0f;
            border: none;
            padding: 0 28px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
            background: linear-gradient(135deg, #33e0ff, #00b8e6);
        }
        button:active {
            transform: translateY(-1px);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: transparent;
        }
        th, td {
            padding: 18px 16px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: #1a1a1a;
            position: sticky;
            top: 0;
        }
        tr:first-child th:first-child {
            border-top-left-radius: 16px;
        }
        tr:first-child th:last-child {
            border-top-right-radius: 16px;
        }
        tr:hover {
            background: rgba(0, 212, 255, 0.03);
        }
        .key-style {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #00d4ff;
            background: #1a2a30;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #2a4a5a;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge-online { background: rgba(0, 230, 118, 0.1); color: var(--accent-green); border: 1px solid rgba(0, 230, 118, 0.3); }
        .badge-menu { background: rgba(0, 212, 255, 0.1); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.3); }
        .badge-offline { background: rgba(255, 255, 255, 0.03); color: #888; border: 1px solid #333; }
        .badge-banned { background: rgba(255, 82, 82, 0.1); color: var(--accent-red); border: 1px solid rgba(255, 82, 82, 0.3); }
        
        .action-btns {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-small {
            padding: 0 16px;
            font-size: 12px;
            border-radius: 8px;
            height: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn-ban { background: transparent; color: var(--accent-red); border: 1.5px solid var(--accent-red); }
        .btn-ban:hover { background: var(--accent-red); color: #0f0f0f; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 82, 82, 0.3); }
        .btn-unban { background: transparent; color: var(--accent-green); border: 1.5px solid var(--accent-green); }
        .btn-unban:hover { background: var(--accent-green); color: #0f0f0f; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 230, 118, 0.3); }
        .btn-extend { background: transparent; color: #00d4ff; border: 1.5px solid #00d4ff; }
        .btn-extend:hover { background: #00d4ff; color: #0f0f0f; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 212, 255, 0.3); }
        .btn-delete { background: transparent; color: #ff5252; border: 1.5px solid #ff5252; }
        .btn-delete:hover { background: #ff5252; color: #0f0f0f; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 82, 82, 0.3); }
        
        .custom-time-input {
            width: 110px;
            padding: 6px 12px;
            height: 34px;
            font-size: 12px;
            background: var(--bg-input);
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
        }
        .custom-time-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

<!-- ПОЛНОЭКРАННЫЙ ОВЕРЛЕЙ АВТОРИЗАЦИИ -->
<div id="login-wrapper">
    <div id="login-screen">
        <h1>RAVGE LOGIN</h1>
        <p class="subtitle">Введите мастер-пароль панели</p>
        <div class="input-group" style="margin-bottom: 20px;">
            <input type="password" id="admin-pass" placeholder="Пароль администратора...">
        </div>
        <button onclick="login()" style="width: 100%;">Войти</button>
    </div>
</div>

<!-- ОСНОВНАЯ ПАНЕЛЬ С КЛЮЧАМИ -->
<div id="main-panel" class="container" style="display: none;">
    <h1>RAVGE PREMIUM CONTROL</h1>
    <p class="subtitle">Панель управления лицензиями • Разработчик ForTrilogy</p>

    <div class="control-panel">
        <div class="input-group">
            <label>Срок действия лицензии</label>
            <select id="duration" onchange="toggleMainCustomTime(this.value)">
                <option value="7d">7 дней</option>
                <option value="15d">15 дней</option>
                <option value="30d">30 дней</option>
                <option value="custom">Своё время...</option>
            </select>
        </div>
        <div class="input-group" id="main-custom-time-group" style="display: none;">
            <label>Кастомное время (например: 12h, 45d, 5m)</label>
            <input type="text" id="main-custom-time" placeholder="Введи время...">
        </div>
        <button onclick="generateKey()">+ Создать лицензию</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Лицензионный ключ</th>
                <th>Логин (Веб)</th>
                <th>Ник в Minecraft</th>
                <th>HWID привязка</th>
                <th>Текущий Сервер</th>
                <th>Окончание подписки</th>
                <th>Действия / Продление / Удаление</th>
            </tr>
        </thead>
        <tbody id="license-table">
            <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Синхронизация данных...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let sessionPassword = '';

    function login() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'coco2012coco!') {
            sessionPassword = pass;
            document.getElementById('login-wrapper').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            loadLicenses();
            setInterval(loadLicenses, 5000);
        } else {
            alert('Неверный мастер-пароль панели!');
        }
    }

    function toggleMainCustomTime(value) {
        const group = document.getElementById('main-custom-time-group');
        if (value === 'custom') {
            group.style.display = 'flex';
        } else {
            group.style.display = 'none';
        }
    }

    function toggleRowCustomTime(rowId, value) {
        const select = document.getElementById(`extend-${rowId}`);
        const input = document.getElementById(`custom-extend-${rowId}`);
        if (value === 'custom') {
            select.style.display = 'none';
            input.style.display = 'inline-block';
            input.focus();
        }
    }

    async function generateKey() {
        const durationSelect = document.getElementById('duration').value;
        let durationVal = durationSelect;
        
        if (durationSelect === 'custom') {
            durationVal = document.getElementById('main-custom-time').value.trim();
            if (!durationVal) {
                alert('Пожалуйста, введите кастомное время срока действия!');
                return;
            }
        }

        try {
            const response = await fetch('/api/admin/generate-license', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, duration: durationVal, login: '—' })
            });
            const data = await response.json();
            if (data.success) {
                alert(`Лицензия создана!
Ключ: ${data.key}`);
                loadLicenses();
            } else { alert(`Ошибка: ${data.error}`); }
        } catch (err) { alert('Ошибка соединения с базой.'); }
    }

    async function toggleBan(key, currentBanStatus) {
        try {
            const response = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key, ban: !currentBanStatus })
            });
            const data = await response.json();
            if (data.success) loadLicenses();
        } catch (e) { console.error(e); }
    }

    async function extendKey(key, rowId) {
        const select = document.getElementById(`extend-${rowId}`);
        const input = document.getElementById(`custom-extend-${rowId}`);
        
        let durationVal = '';
        if (select.style.display === 'none') {
            durationVal = input.value.trim();
            if (!durationVal) {
                alert('Введите кастомное время для продления подписки!');
                return;
            }
        } else {
            durationVal = select.value;
        }

        try {
            const response = await fetch('/api/admin/extend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key, duration: durationVal })
            });
            const data = await response.json();
            if (data.success) { 
                alert('Время подписки успешно обновлено!'); 
                loadLicenses(); 
            } else {
                alert(`Ошибка продления: ${data.error}`);
            }
        } catch (e) { console.error(e); }
    }

    async function deleteKey(key) {
        if (!confirm('Вы уверены, что хотите НАВСЕГДА удалить этот ключ из базы данных?')) return;
        
        try {
            const response = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: key })
            });
            const data = await response.json();
            if (data.success) {
                loadLicenses();
            } else {
                alert(`Ошибка удаления: ${data.error}`);
            }
        } catch (e) { console.error(e); }
    }

    async function loadLicenses() {
        try {
            const response = await fetch('/api/admin/keys');
            const data = await response.json();
            const tableBody = document.getElementById('license-table');
            if (!tableBody) return;

            // Сохраняем текущие значения открытых кастомных инпутов, чтобы они не сбрасывались при обновлении
            const activeCustomValues = {};
            tableBody.querySelectorAll('.custom-time-input').forEach(input => {
                if (input.style.display === 'inline-block') {
                    activeCustomValues[input.dataset.rowId] = input.value;
                }
            });

            tableBody.innerHTML = '';
            const licenses = data.licenses || [];

            if (licenses.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Ключей в базе данных не обнаружено</td></tr>`;
                return;
            }

            licenses.forEach(lic => {
                const row = document.createElement('tr');
                const expireDate = lic.expires_at ? new Date(lic.expires_at).toLocaleString('ru-RU') : 'Истекла';
                
                let serverBadge = `<span class="badge badge-offline">Оффлайн</span>`;
                if (lic.is_banned) {
                    serverBadge = `<span class="badge badge-banned">Забанен</span>`;
                } else if (lic.last_server === 'В меню') {
                    serverBadge = `<span class="badge badge-menu">В меню</span>`;
                } else if (lic.last_server && lic.last_server !== 'Оффлайн') {
                    serverBadge = `<span class="badge badge-online">${lic.last_server}</span>`;
                }

                const banBtn = lic.is_banned 
                    ? `<button class="btn-small btn-unban" onclick="toggleBan('${lic.license_key.replace(/'/g, "\\'")}', true)">Разбанить</button>`
                    : `<button class="btn-small btn-ban" onclick="toggleBan('${lic.license_key.replace(/'/g, "\\'")}', false)">Забанить</button>`;

                const selectId = `extend-${lic.id}`;
                const inputId = `custom-extend-${lic.id}`;
                const wasCustomActive = activeCustomValues[lic.id] !== undefined;

                row.innerHTML = `
                    <td>${lic.id}</td>
                    <td><span class="key-style">${lic.license_key}</span></td>
                    <td style="font-weight: bold; color: #fff;">${lic.web_login || '—'}</td>
                    <td style="color: #00e676; font-weight: 500;">${lic.last_name || '—'}</td>
                    <td style="font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted);">${lic.hwid || 'Свободно'}</td>
                    <td>${serverBadge}</td>
                    <td>${expireDate}</td>
                    <td>
                        <div class="action-btns">
                            ${banBtn}
                            <select id="${selectId}" style="padding: 6px; font-size: 12px; background: #242424; border: 1px solid #444; border-radius: 8px; color: #fff; display: ${wasCustomActive ? 'none' : 'inline-block'};" onchange="toggleRowCustomTime(${lic.id}, this.value)">
                                <option value="7d">+7д</option>
                                <option value="15d">+15д</option>
                                <option value="30d">+30д</option>
                                <option value="custom">Своё время...</option>
                            </select>
                            <input type="text" id="${inputId}" class="custom-time-input" data-row-id="${lic.id}" placeholder="12h, 5m, 3d" style="display: ${wasCustomActive ? 'inline-block' : 'none'};" value="${wasCustomActive ? activeCustomValues[lic.id] : ''}">
                            <button class="btn-small btn-extend" onclick="extendKey('${lic.license_key.replace(/'/g, "\\'")}', ${lic.id})">Продлить</button>
                            <button class="btn-small btn-delete" onclick="deleteKey('${lic.license_key.replace(/'/g, "\\'")}')">Удалить</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) { console.error(err); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Проверяем, если пароль уже был введен ранее в сессии
        if (sessionPassword === 'coco2012coco!') {
            document.getElementById('login-wrapper').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
        }
    });
</script>
</body>
</html>
