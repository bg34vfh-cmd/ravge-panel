<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>Guard Panel</title><style>:root{--bg:#050508;--panel:rgba(13,14,24,0.7);--brd:rgba(168,85,247,0.15);--neon:#a855f7;--neon-g:#6366f1;--txt:#e4e4e7;--m:#717694}body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);margin:0;padding:30px 15px;display:flex;justify-content:center;min-height:100vh;background-image:radial-gradient(circle at 50% 0,rgba(168,85,247,0.15) 0,transparent 50%)}.container{width:100%;max-width:1200px;background:var(--panel);backdrop-filter:blur(12px);padding:30px;border-radius:16px;border:1px solid var(--brd);box-shadow:0 20px 50px rgba(0,0,0,0.8);animation:show .4s ease}@keyframes show{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}h2{margin:0 0 25px 0;font-size:26px;font-weight:800;letter-spacing:-.5px;text-transform:uppercase}.stats-grid{display:flex;gap:15px;margin-bottom:25px}.stat-card{flex:1;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);padding:15px;border-radius:12px;position:relative;overflow:hidden}.stat-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--neon)}.controls{display:flex;gap:10px;align-items:center;margin-bottom:20px;background:rgba(255,255,255,0.02);padding:15px;border-radius:12px;border:1px solid rgba(255,255,255,0.05)}select,input,button{background:rgba(0,0,0,0.4);color:#fff;border:1px solid rgba(255,255,255,0.1);padding:10px 16px;border-radius:8px;font-size:13px;outline:none;transition:all .2s}select:focus,input:focus{border-color:var(--neon);box-shadow:0 0 10px rgba(168,85,247,0.2)}button{background:linear-gradient(135s,var(--neon),var(--neon-g));border:none;cursor:pointer;font-weight:700;box-shadow:0 4px 15px rgba(168,85,247,0.25)}button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(168,85,247,0.4)}table{width:100%;border-collapse:collapse;background:rgba(0,0,0,0.2);border-radius:12px;overflow:hidden}th,td{padding:14px 18px;text-align:left;font-size:13px;border-bottom:1px solid rgba(255,255,255,0.03)}th{background:rgba(255,255,255,0.03);color:var(--m);font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.5px}tr:hover td{background:rgba(168,85,247,0.02)}.badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;text-transform:uppercase;background:rgba(16,185,129,0.1);color:#34d399;border:1px solid rgba(16,185,129,0.2)}.badge-banned{background:rgba(244,63,94,0.1);color:#f87171;border:1px solid rgba(244,63,94,0.2)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--m)}.dot-online{background:#10b981;box-shadow:0 0 10px #10b981;animation:pulse 2s infinite}@keyframes pulse{0%{box-shadow:0 0 4px #10b981}50%{box-shadow:0 0 12px #10b981}100%{box-shadow:0 0 4px #10b981}}#logConsole{background:rgba(0,0,0,0.5);padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-family:monospace;font-size:12px;color:var(--m);margin-bottom:20px}#authScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:9999}</style></head><body><div id="authScreen"><div style="background:var(--panel);backdrop-filter:blur(10px);padding:35px;border-radius:16px;border:1px solid var(--brd);text-align:center;width:260px;box-shadow:0 30px 60px rgba(0,0,0,0.8)"><h2>Вход в <span style="color:var(--neon)">Guard</span></h2><input type="password" id="adminPassword" placeholder="Ключ доступа..." style="width:calc(100% - 34px);margin-bottom:15px;text-align:center"><br><button onclick="checkAuth()" style="width:100%">Войти в систему</button><p id="authErr" style="color:#f43f5e;font-size:12px;display:none;margin:12px 0 0 0;font-weight:700">❌ Доступ запрещен</p></div></div><div class="container" id="mainPanel" style="display:none"><h2>⚡ <span style="color:var(--neon)">Guard</span> Premium Center</h2><div class="stats-grid"><div class="stat-card"><div>Всего лицензий</div><div id="statTotal" style="font-size:22px;font-weight:800;margin-top:5px">—</div></div><div class="stat-card" style="border-color:rgba(16,185,129,0.15)"><div>Пользователи Online</div><div id="statOnline" style="font-size:22px;font-weight:800;margin-top:5px;color:#10b981">—</div></div><div class="stat-card" style="border-color:rgba(99,102,241,0.15)"><div>Активные сессии</div><div id="statActive" style="font-size:22px;font-weight:800;margin-top:5px;color:var(--neon-g)">—</div></div></div><div class="controls"><select id="daysSelect" onchange="document.getElementById('customInput').style.display=this.value==='custom'?'inline-block':'none'"><option value="7d">7 Дней</option><option value="15d">15 Дней</option><option value="30d" selected>30 Дней</option><option value="1h">1 Час</option><option value="custom">Свой формат</option></select> <input type="text" id="customInput" placeholder="10m" style="display:none;width:60px"> <button onclick="genLic()">＋ Создать Ключ</button><button onclick="send('/api/admin/generate-reset',{})" style="background:linear-gradient(135s,#2563eb,#3b82f6)">🔄 Сброс HWID</button> <input type="text" id="searchInput" oninput="loadKeys()" placeholder="🔍 Поиск покупателя..." style="margin-left:auto;width:200px"></div><div id="logConsole">🟢 Терминал активен и готов к работе...</div><div style="overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,0.05)"><table><thead><tr><th>ID</th><th>Сеть</th><th>Логин</th><th>Игрок</th><th>Сервер</th><th>Лицензионный Ключ</th><th>Время</th><th>Статус</th><th style="text-align:right">Управление</th></tr></thead><tbody id="keysTable"></tbody></table></div></div><script>const log=(m,c='var(--m)')=>document.getElementById('logConsole').innerHTML=`<span style="color:${c}">${m}</span>`;function checkAuth(){if(document.getElementById('adminPassword').value==='coco2012coco!'){document.getElementById('authScreen').style.display='none';document.getElementById('mainPanel').style.display='block';loadKeys();setInterval(loadKeys,3000)}else{document.getElementById('authErr').style.display='block'}}function genLic(){let v=document.getElementById('daysSelect').value;if(v==='custom')v=document.getElementById('customInput').value.trim();send('/api/admin/generate-license',{timeInput:v})}function cp(t,b){navigator.clipboard.writeText(t).then(()=>{const ot=b.innerText;b.innerText="Скопировано";setTimeout(()=>b.innerText=ot,1000)})}async function send(u,d){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok){log("✨ Операция выполнена и синхронизирована с Neon Postgres","#10b981");loadKeys()}}function loadKeys(){if(document.getElementById('mainPanel').style.display==='none')return;const flt=document.getElementById('searchInput').value.trim().toLowerCase();fetch('/api/admin/keys').then(r=>r.json()).then(d=>{const tbody=document.getElementById('keysTable');tbody.innerHTML='';if(d.success&&d.keys){let tot=d.keys.length,on=0,act=0;d.keys.forEach(k=>{const u=k.login||'—';if(flt&&!u.toLowerCase().includes(flt))return;const isB=k.status==='banned',isR=k.type==='reset',isO=(Date.now()-parseInt(k.last_seen||0))<20000;if(isO&&!isB)on++;if(!isB&&!isR&&parseInt(k.expires_at)>Date.now())act++;let tLeft='<span style="color:#f43f5e;font-weight:700">Истёк</span>',bCls='badge';if(isR){tLeft='<span style="color:var(--neon-g)">Одноразовый</span>'}else if(parseInt(k.expires_at)>Date.now()){const df=parseInt(k.expires_at)-Date.now(),dd=Math.floor(df/86400000),hh=Math.floor((df%86400000)/3600000);tLeft=dd>0?`#10b981">${dd}д ${hh}ч`:`#6366f1">${hh}ч`;tLeft=`<span style="color:${tLeft}</span>`}if(isB)bCls='badge badge-banned';tbody.innerHTML+=`<tr><td style="color:var(--m)">#${k.id}</td><td>${isR||!k.hwid?'—':`<span class="dot ${isO?'dot-online':''}"></span>`}</td><td style="font-weight:700;color:var(--neon)">${u}</td><td>${isR?'—':k.player_name}</td><td style="color:#6366f1;font-family:monospace">${isR||!isO?'—':k.server_ip}</td><td style="font-family:monospace;color:#fff">${k.key}<button style="padding:4px 8px;font-size:11px;margin-left:8px;background:rgba(255,255,255,0.05);box-shadow:none" onclick="cp('${k.key}',this)">Копировать</button></td><td>${tLeft}</td><td><span class="${bCls}">${k.status}</span></td><td style="text-align:right">${!isR?`<button style="background:rgba(255,255,255,0.05);box-shadow:none;padding:6px 10px;margin-right:3px" onclick="send('/api/admin/action',{action:'reset',id:${k.id}})">Сброс</button>`:''}<button onclick="send('/api/admin/action',{action:'${isB?'unban':'ban'}',id:${k.id}})" style="background:${isB?'#10b981':'#f43f5e'};box-shadow:none;padding:6px 10px;margin-right:3px">${isB?'Разбан':'Бан'}</button><button onclick="send('/api/admin/action',{action:'delete',id:${k.id}})" style="background:#27272a;box-shadow:none;padding:6px 10px">Удалить</button></td></tr>`});document.getElementById('statTotal').innerText=tot;document.getElementById('statOnline').innerText=on;document.getElementById('statActive').innerText=act}})}</script></body></html>
