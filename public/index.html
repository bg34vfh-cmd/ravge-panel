<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM CONTROL v2.2</title>
    <style>
        :root {
            --bg-main: #0a0516;
            --bg-card: #120924;
            --bg-input: #1a0f33;
            --primary: #8a2be2;
            --primary-hover: #9d4edd;
            --accent-green: #00f5d4;
            --accent-red: #ff007f;
            --text-main: #ffffff;
            --text-muted: #a497c2;
            --border: #2e1a4e;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
            box-sizing: border-box;
        }
        #login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-main);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #login-screen {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 1400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff007f, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 35px;
        }
        .control-panel {
            display: flex;
            gap: 20px;
            align-items: center;
            background: #170d2e;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #3c1e6d;
            margin-bottom: 35px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        select, input {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid #4a2785;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 14px;
            transition: border 0.2s;
        }
        select:focus, input:focus {
            border-color: var(--primary-hover);
        }
        button {
            background: linear-gradient(135deg, var(--primary), #5b00b3);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: transparent;
        }
        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        tr:hover {
            background: rgba(138, 43, 226, 0.04);
        }
        .key-style {
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            color: #e0aaff;
            background: #24123a;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #43236a;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-online { background: rgba(0, 245, 212, 0.1); color: var(--accent-green); }
        .badge-menu { background: rgba(138, 43, 226, 0.1); color: #b577ff; }
        .badge-offline { background: rgba(255, 255, 255, 0.05); color: #888; }
        .badge-banned { background: rgba(255, 0, 127, 0.1); color: var(--accent-red); }
        
        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-small {
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 6px;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 600;
        }
        .btn-ban { background: #3a001c; color: var(--accent-red); border: 1px solid var(--accent-red); }
        .btn-ban:hover { background: var(--accent-red); color: #000; transform: none; box-shadow: none; }
        .btn-unban { background: #003a30; color: var(--accent-green); border: 1px solid var(--accent-green); }
        .btn-unban:hover { background: var(--accent-green); color: #000; transform: none; box-shadow: none; }
        .btn-extend { background: #22173d; color: #fff; border: 1px solid var(--primary); }
        .btn-extend:hover { transform: none; box-shadow: none; background: var(--primary); }
        .btn-delete { background: #2b000a; color: #ff3366; border: 1px solid #ff3366; }
        .btn-delete:hover { background: #ff3366; color: #000; transform: none; box-shadow: none; }
    </style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ НА ВЕСЬ ЭКРАН -->
<div id="login-wrapper">
    <div id="login-screen">
        <h1>RAVGE LOGIN</h1>
        <p class="subtitle">Введите мастер-пароль панели</p>
        <div class="input-group" style="margin-bottom: 20px;">
            <input type="password" id="admin-pass" placeholder="Пароль администратора..." style="width: 100%; box-sizing: border-box;">
        </div>
        <button onclick="login()" style="width: 100%;">Войти</button>
    </div>
</div>

<!-- ОСНОВНАЯ ПАНЕЛЬ С КЛЮЧАМИ -->
<div id="main-panel" class="container" style="display: none;">
    <h1>RAVGE PREMIUM CONTROL</h1>
    <p class="subtitle">Панель управления лицензиями • Разработчик ForTrilogy</p>

    <div class="control-panel">
        <div class="input-group">
            <label>Срок действия</label>
            <select id="duration">
                <option value="7d">7 дней</option>
                <option value="15d">15 дней</option>
                <option value="30d">30 дней</option>
            </select>
        </div>
        <button onclick="generateKey()" style="margin-top: 16px;">+ Создать чистую лицензию</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Лицензионный ключ</th>
                <th>Логин (Веб)</th>
                <th>Ник в Minecraft</th>
                <th>HWID привязка</th>
                <th>Текущий Сервер</th>
                <th>Окончание подписки</th>
                <th>Действия / Продление / Удаление</th>
            </tr>
        </thead>
        <tbody id="license-table">
            <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Синхронизация данных...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let sessionPassword = '';

    function login() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'coco2012coco!') {
            sessionPassword = pass;
            document.getElementById('login-wrapper').style.display = 'none';
            document.getElementById('main-panel').style.display = 'block';
            loadLicenses();
            setInterval(loadLicenses, 5000); 
        } else {
            alert('Неверный мастер-пароль панели!');
        }
    }

    async function generateKey() {
        const durationVal = document.getElementById('duration').value;

        try {
            const response = await fetch('/api/admin/generate-license', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, duration: durationVal })
            });
            const data = await response.json();
            if (data.success) {
                alert(`Лицензия успешно создана!\nКлюч: ${data.key}`);
                loadLicenses();
            } else { alert(`Ошибка: ${data.error}`); }
        } catch (err) { alert('Ошибка соединения с базой.'); }
    }

    async function toggleBan(licenseKey, currentBanStatus) {
        try {
            const response = await fetch('/api/admin/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: licenseKey, ban: !currentBanStatus })
            });
            const data = await response.json();
            if (data.success) {
                loadLicenses();
            } else {
                alert('Ошибка изменения статуса бана');
            }
        } catch (e) { console.error(e); }
    }

    async function extendKey(licenseKey, selectId) {
        const duration = document.getElementById(selectId).value;
        try {
            const response = await fetch('/api/admin/extend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: licenseKey, duration: duration })
            });
            const data = await response.json();
            if (data.success) { 
                alert('Время успешно добавлено к лицензии!'); 
                loadLicenses(); 
            } else {
                alert('Ошибка продления лицензии');
            }
        } catch (e) { console.error(e); }
    }

    async function deleteKey(licenseKey) {
        if (!confirm('Вы уверены, что хотите НАВСЕГДА удалить этот ключ из базы данных?')) return;
        
        try {
            const response = await fetch('/api/admin/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: sessionPassword, key: licenseKey })
            });
            const data = await response.json();
            if (data.success) {
                loadLicenses();
            } else {
                alert(`Ошибка удаления: ${data.error || 'эндпоинт удаления не поддерживается вашим сервером'}`);
            }
        } catch (e) { console.error(e); }
    }

    async function loadLicenses() {
        try {
            const response = await fetch('/api/admin/keys');
            const data = await response.json();
            const tableBody = document.getElementById('license-table');
            if (!tableBody) return;
            tableBody.innerHTML = '';

            const list = data.licenses || [];
            if (list.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Ключей в базе данных не обнаружено</td></tr>`;
                return;
            }

            list.forEach(lic => {
                const row = document.createElement('tr');
                
                // Поддержка разных названий колонок (совместимость)
                const licenseKey = lic.license_key || lic.key || '';
                const webLogin = lic.web_login || '—';
                const minecraftName = lic.last_name || '—';
                const hwidVal = lic.hwid || 'Свободно';
                const currentServer = lic.last_server || lic.server || 'Оффлайн';
                const isBanned = lic.is_banned || lic.banned || false;
                
                const expireDate = lic.expires_at ? new Date(lic.expires_at).toLocaleString('ru-RU') : 'Истекла';
                
                let serverBadge = `<span class="badge badge-offline">Оффлайн</span>`;
                if (isBanned) {
                    serverBadge = `<span class="badge badge-banned">Забанен</span>`;
                } else if (currentServer === 'В меню') {
                    serverBadge = `<span class="badge badge-menu">В меню</span>`;
                } else if (currentServer && currentServer !== 'Оффлайн') {
                    serverBadge = `<span class="badge badge-online">${currentServer}</span>`;
                }

                // Исправлено: экранируем кавычки для безопасного вызова функций с текстовым аргументом ключа
                const escapedKey = licenseKey.replace(/'/g, "\\'");

                const banBtn = isBanned 
                    ? `<button class="btn-small btn-unban" onclick="toggleBan('${escapedKey}', true)">Разбанить</button>`
                    : `<button class="btn-small btn-ban" onclick="toggleBan('${escapedKey}', false)">Забанить</button>`;

                const selectId = `extend-${lic.id}`;

                row.innerHTML = `
                    <td>${lic.id}</td>
                    <td><span class="key-style">${licenseKey}</span></td>
                    <td style="font-weight: bold; color: #fff;">${webLogin}</td>
                    <td style="color: #00f5d4; font-weight: 500;">${minecraftName}</td>
                    <td style="font-size: 11px; font-family: monospace; color: var(--text-muted);">${hwidVal}</td>
                    <td>${serverBadge}</td>
                    <td>${expireDate}</td>
                    <td>
                        <div class="action-btns">
                            ${banBtn}
                            <select id="${selectId}" style="padding: 6px; font-size: 12px; background: #251842; border-color: #4a2785;">
                                <option value="7d">+7д</option>
                                <option value="15d">+15д</option>
                                <option value="30d">+30д</option>
                            </select>
                            <button class="btn-small btn-extend" onclick="extendKey('${escapedKey}', '${selectId}')">Продлить</button>
                            <button class="btn-small btn-delete" onclick="deleteKey('${escapedKey}')">Удалить</button>
                        </div>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) { console.error(err); }
    }
</script>
</body>
</html>
