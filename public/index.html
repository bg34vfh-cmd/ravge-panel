<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0b0e; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        
        /* Экран авторизации */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0e; display: flex; align-items: center;
            justify-content: center; z-index: 9999;
        }
        .login-box {
            background: #121217; padding: 30px; border-radius: 12px;
            border: 2px solid #581c87; text-align: center;
            box-shadow: 0 0 25px rgba(88, 28, 135, 0.4); width: 100%; max-width: 400px;
        }
        .login-box h2 { margin-bottom: 20px; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .login-box h2 span { color: #a855f7; }
        .login-box input { width: 100%; margin-bottom: 15px; padding: 12px; text-align: center; background: #1c1c28; color: #fff; border: 1px solid #4c1d95; border-radius: 6px; outline: none; }
        .login-box input:focus { border-color: #a855f7; }
        .login-box .btn { width: 100%; padding: 12px; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

        /* Основной контент панели (скрыт по умолчанию) */
        .container { 
            display: none; width: 100%; max-width: 1300px; 
            background: #121217; border-radius: 12px; border: 2px solid #581c87; 
            padding: 30px; box-shadow: 0 0 25px rgba(88, 28, 135, 0.4); 
        }
        
        h1 { font-size: 28px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: #a855f7; }
        .subtitle { color: #71717a; font-size: 14px; margin-bottom: 25px; }
        .generator-block { display: flex; align-items: center; gap: 10px; background: #161622; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #2e1052; }
        select, input { background: #1c1c28; color: #fff; border: 1px solid #4c1d95; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        select:focus, input:focus { border-color: #a855f7; }
        .btn { background: #581c87; color: #fff; border: none; padding: 11px 22px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(88, 28, 135, 0.3); }
        .btn:hover { background: #7024ab; transform: translateY(-1px); }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #14141c; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 14px; font-size: 13px; vertical-align: middle; }
        th { background: #181820; color: #a1a1aa; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        tr { border-bottom: 1px solid #1f1f2e; }
        tr:hover { background: #1b1b26; }
    </style>
</head>
<body>

    <!-- Форма входа -->
    <div id="login-screen">
        <div class="login-box">
            <h2><span>RAVGE</span> LOGIN</h2>
            <input type="password" id="pass-input" placeholder="Введите пароль" autofocus>
            <button class="btn" onclick="checkPassword()">Войти</button>
            <div class="error-msg" id="error-txt">Неверный пароль!</div>
        </div>
    </div>

    <!-- Основная панель -->
    <div class="container" id="admin-panel">
        <h1><span>RAVGE</span> PREMIUM</h1>
        <div class="subtitle">Панель управления администратора</div>
        
        <div class="generator-block">
            <input type="text" placeholder="Значение...">
            <select>
                <option>Опция 1</option>
                <option>Опция 2</option>
            </select>
            <button class="btn">Действие</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Статус</th>
                        <th>Дата</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1001</td>
                        <td>Активен</td>
                        <td>01.08.2026</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            const errorTxt = document.getElementById('error-txt');
            const loginScreen = document.getElementById('login-screen');
            const adminPanel = document.getElementById('admin-panel');

            // Теперь код работает корректно
            if (input === 'coco2012coco!') {
                loginScreen.style.display = 'none';
                adminPanel.style.display = 'block';
            } else {
                errorTxt.style.display = 'block';
                document.getElementById('pass-input').value = '';
            }
        }

        // Вход по нажатию Enter
        document.getElementById('pass-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
