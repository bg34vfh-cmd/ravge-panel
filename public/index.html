<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0b0e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 1150px; background: #121217; border-radius: 12px; border: 2px solid #581c87; padding: 30px; box-shadow: 0 0 25px rgba(88, 28, 135, 0.4); }
        h1 { font-size: 28px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: #a855f7; }
        .subtitle { color: #71717a; font-size: 14px; margin-bottom: 25px; }
        
        .controls-panel { display: flex; gap: 10px; align-items: center; margin-bottom: 30px; background: #14141c; padding: 15px; border-radius: 8px; border: 1px solid #1f1f2e; }
        input[type="text"] { background: #1c1c24; border: 1px solid #3f3f46; color: #fff; padding: 10px 15px; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus { border-color: #a855f7; }
        
        .btn { background: #581c87; color: #fff; border: none; padding: 11px 24px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: #7024ab; transform: translateY(-1px); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; background: #14141c; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px 15px; font-size: 14px; }
        th { background: #181820; color: #a1a1aa; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr { border-bottom: 1px solid #1f1f2e; }
        tr:hover { background: #1b1b26; }
        
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status.banned { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        .action-btn { background: none; border: 1px solid #3f3f46; color: #a1a1aa; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.15s; }
        .action-btn.ban { border-color: #ef4444; color: #f87171; }
        .action-btn.ban:hover { background: #ef4444; color: #fff; }
        .action-btn.extend { border-color: #3b82f6; color: #60a5fa; }
        .action-btn.extend:hover { background: #3b82f6; color: #fff; }
        .action-btn.del { border-color: #71717a; color: #e4e4e7; }
        .action-btn.del:hover { background: #e4e4e7; color: #000; }
        
        .extend-input { width: 80px !important; padding: 4px 8px !important; font-size: 12px !important; margin-right: 4px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>RAVGE <span>PREMIUM</span> CONTROL</h1>
    <div class="subtitle">Разработчик: Forthbxr | Полное управление временем (мин, ч, д)</div>
    
    <div class="controls-panel">
        <input type="text" id="gen-time" value="30 д" placeholder="Пример: 10 мин, 5 ч, 30 д">
        <button class="btn" onclick="generateKey()">⚡ Создать Ключ</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Лицензионный Ключ</th>
                <th>Покупатель</th>
                <th>Сервер</th>
                <th>Окончание подписки</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="keys-table-body"></tbody>
    </table>
</div>

<script>
    async function loadKeys() {
        try {
            const res = await fetch('/api/admin/keys');
            const data = await res.json();
            if (!data.success) return;

            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = '';

            data.keys.forEach(item => {
                const tr = document.createElement('tr');
                let expiresStr = 'Не активирован';
                if (item.expires_at > 0) {
                    expiresStr = new Date(item.expires_at).toLocaleString('ru-RU');
                }

                tr.innerHTML = `
                    <td>#${item.id}</td>
                    <td style="font-weight: bold; letter-spacing: 0.5px;">${item.key}</td>
                    <td style="color: #60a5fa;">${item.player_name || '—'}</td>
                    <td style="color: #fbbf24;">${item.server_ip || '—'}</td>
                    <td style="color: #c084fc;">${expiresStr}</td>
                    <td><span class="status ${item.status}">${item.status.toUpperCase()}</span></td>
                    <td>
                        <button class="action-btn ban" onclick="toggleStatus(${item.id}, '${item.status}')">${item.status === 'active' ? 'Бан' : 'Разбан'}</button>
                        <input type="text" class="extend-input" id="ext-input-${item.id}" value="30 д" placeholder="10 мин">
                        <button class="action-btn extend" onclick="extendKey(${item.id})">Продлить</button>
                        <button class="action-btn del" onclick="deleteKey(${item.id})">Удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) { console.error(e); }
    }

    async function generateKey() {
        const timeInput = document.getElementById('gen-time').value;
        await fetch('/api/admin/generate-license', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timeInput })
        });
        loadKeys();
    }

    async function extendKey(id) {
        const timeInput = document.getElementById(`ext-input-${id}`).value;
        await fetch('/api/admin/extend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, timeInput })
        });
        loadKeys();
    }

    async function toggleStatus(id, currentStatus) {
        await fetch('/api/admin/toggle-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, currentStatus })
        });
        loadKeys();
    }

    async function deleteKey(id) {
        if (!confirm("Удалить ключ?")) return;
        await fetch('/api/admin/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        loadKeys();
    }

    loadKeys();
    setInterval(loadKeys, 3000);
</script>
</body>
</html>
