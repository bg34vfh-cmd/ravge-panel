<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Guard Panel</title>
    <style>
        :root{--bg:#08080c;--c:#0f1016;--b:#222533;--p:#a855f7;--t:#f4f4f7;--m:#717694}
        body{font-family:sans-serif;background:var(--bg);color:var(--t);margin:20px}
        .container{max-width:1200px;margin:0 auto;background:var(--c);padding:20px;border-radius:10px;border:1px solid var(--b)}
        .stats-grid{display:flex;gap:10px;margin-bottom:15px}.stat-card{flex:1;background:rgba(255,255,255,0.02);border:1px solid var(--b);padding:10px;border-radius:6px;font-size:12px}
        .controls{display:flex;gap:8px;align-items:center;margin-bottom:15px;background:#13151f;padding:12px;border-radius:8px;border:1px solid var(--b)}
        select,input,button{background:#14161f;color:#fff;border:1px solid var(--b);padding:8px 12px;border-radius:6px;font-size:13px;outline:none}
        button{background:var(--p);cursor:pointer;font-weight:700}button:hover{opacity:0.8}
        table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;font-size:13px;border-bottom:1px solid var(--b)}
        th{background:#13151f;color:var(--m);font-size:11px;text-transform:uppercase}
        .badge{padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;background:rgba(16,185,129,0.1);color:#34d399}
        .badge-banned{background:rgba(244,63,94,0.1);color:#f87171}
        .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--m)}
        .dot-online{background:#10b981;box-shadow:0 0 8px #10b981}
        #logConsole{background:#050507;padding:8px 12px;border-radius:6px;font-family:monospace;font-size:12px;color:var(--m);margin-bottom:15px}
        #authScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:9999}
    </style>
</head>
<body>
    <div id="authScreen"><div style="background:var(--c);padding:25px;border-radius:10px;border:1px solid var(--b);text-align:center;width:240px"><h2>Вход</h2><input type="password" id="adminPassword" placeholder="Пароль..." style="width:90%;margin-bottom:15px;text-align:center"><br><button onclick="checkAuth()" style="width:100%">Войти</button><p id="authErr" style="color:#f43f5e;font-size:12px;display:none;margin:10px 0 0 0">❌ Ошибка!</p></div></div>
    <div class="container" id="mainPanel" style="display:none">
        <h2 style="margin:0 0 15px 0">Guard <span style="color:var(--p)">Panel</span></h2>
        <div class="stats-grid">
            <div class="stat-card"><div style="color:var(--m)">Всего ключей</div><div id="statTotal" style="font-size:18px;font-weight:700">—</div></div>
            <div class="stat-card"><div style="color:var(--m)">Online</div><div id="statOnline" style="font-size:18px;font-weight:700;color:#10b981">—</div></div>
            <div class="stat-card"><div style="color:var(--m)">Активные</div><div id="statActive" style="font-size:18px;font-weight:700;color:var(--p)">—</div></div>
        </div>
        <div class="controls">
            <select id="daysSelect" onchange="document.getElementById('customInput').style.display=this.value==='custom'?'inline-block':'none'"><option value="7d">7 Дней</option><option value="15d">15 Дней</option><option value="30d" selected>30 Дней</option><option value="1h">1 Час</option><option value="custom">Свой...</option></select>
            <input type="text" id="customInput" placeholder="10m" style="display:none;width:60px">
            <button onclick="genLic()">Создать</button><button onclick="send('/api/admin/generate-reset',{})" style="background:#3b82f6">Сброс HWID</button>
            <input type="text" id="searchInput" oninput="loadKeys()" placeholder="🔍 Поиск..." style="margin-left:auto;width:180px">
        </div>
        <div id="logConsole">🟢 Готов...</div>
        <div style="overflow-x:auto">
            <table>
                <thead><tr><th>ID</th><th>Сеть</th><th>Логин</th><th>Игрок</th><th>Сервер</th><th>Ключ</th><th>Время</th><th>Статус</th><th style="text-align:right">Действия</th></tr></thead>
                <tbody id="keysTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        const log = (m, c='var(--m)') => document.getElementById('logConsole').innerHTML = `<span style="color:${c}">${m}</span>`;
        async function checkAuth() {
            const r = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('adminPassword').value})});
            if(r.ok){document.getElementById('authScreen').style.display='none';document.getElementById('mainPanel').style.display='block';loadKeys();setInterval(loadKeys,3000)}else document.getElementById('authErr').style.display='block';
        }
        function genLic() { let v = document.getElementById('daysSelect').value; if(v==='custom')v=document.getElementById('customInput').value.trim(); send('/api/admin/generate-license',{timeInput:v}) }
        function cp(t, b) { navigator.clipboard.writeText(t).then(() => { const ot=b.innerText; b.innerText="ОК"; setTimeout(() => b.innerText=ot,1000) }) }
        async function send(u, d){
            const r = await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
            if(r.ok){log("⚡ Успешно синхронизировано!", "#10b981"); loadKeys()}
        }
        function loadKeys(){
            if(document.getElementById('mainPanel').style.display==='none') return;
            const flt = document.getElementById('searchInput').value.trim().toLowerCase();
            fetch('/api/admin/keys').then(r=>r.json()).then(d=>{
                const tbody = document.getElementById('keysTable'); tbody.innerHTML = '';
                if(d.success && d.keys) {
                    let tot=d.keys.length, on=0, act=0;
                    d.keys.forEach(k => {
                        const u = k.login || '—'; if(flt && !u.toLowerCase().includes(flt)) return;
                        const isB=k.status==='banned', isR=k.type==='reset', isO=(Date.now()-parseInt(k.last_seen||0))<20000;
                        if(isO && !isB) on++; if(!isB && !isR && parseInt(k.expires_at)>Date.now()) act++;
                        let tLeft='<span style="color:#f43f5e">Истёк</span>', bCls='badge';
                        if(isR) tLeft='<span>Одноразовый</span>';
                        else if(parseInt(k.expires_at)>Date.now()){
                            const df=parseInt(k.expires_at)-Date.now(), dd=Math.floor(df/86400000), hh=Math.floor((df%86400000)/3600000);
                            tLeft = dd>0?`#10b981">${dd}д ${hh}ч`:`#3b82f6">${hh}ч`; tLeft=`<span style="color:${tLeft}</span>`;
                        }
                        if(isB) bCls='badge badge-banned';
                        tbody.innerHTML += `<tr><td>#${k.id}</td><td>${isR||!k.hwid?'—':`<span class="dot ${isO?'dot-online':''}"></span>`}</td>
                            <td style="font-weight:700;color:var(--p)">${u}</td><td>${isR?'—':k.player_name}</td><td>${isR||!isO?'—':k.server_ip}</td>
                            <td>${k.key}<button style="padding:2px 6px;font-size:11px;margin-left:5px" onclick="cp('${k.key}',this)">Копировать</button></td>
                            <td>${tLeft}</td><td><span class="${bCls}">${k.status}</span></td>
                            <td style="text-align:right">${!isR?`<button onclick="send('/api/admin/action',{action:'reset',id:${k.id}})">Сброс</button>`:''}
                            <button onclick="send('/api/admin/action',{action:'${isB?'unban':'ban'}',id:${k.id}})" style="background:${isB?'#10b981':'#f43f5e'}">${isB?'Разбан':'Бан'}</button>
                            <button onclick="send('/api/admin/action',{action:'delete',id:${k.id}})" style="background:#3f3f46">Х</button></td></tr>`;
                    });
                    document.getElementById('statTotal').innerText=tot; document.getElementById('statOnline').innerText=on; document.getElementById('statActive').innerText=act;
                }
            });
        }
    </script>
</body>
</html>
