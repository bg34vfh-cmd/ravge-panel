<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVGE PREMIUM Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0b0e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .container { width: 100%; max-width: 1200px; background: #121217; border-radius: 12px; border: 2px solid #581c87; padding: 30px; box-shadow: 0 0 25px rgba(88, 28, 135, 0.4); }
        h1 { font-size: 28px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        h1 span { color: #a855f7; }
        .subtitle { color: #71717a; font-size: 14px; margin-bottom: 25px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn { background: #581c87; color: #fff; border: none; padding: 12px 24px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: all 0.2s ease-in-out; box-shadow: 0 4px 10px rgba(88, 28, 135, 0.3); }
        .btn:hover { background: #7024ab; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(88, 28, 135, 0.5); }
        .btn.danger { background: #7f1d1d; box-shadow: 0 4px 10px rgba(127, 29, 29, 0.3); border: 1px solid #ef4444; }
        .btn.danger:hover { background: #991b1b; box-shadow: 0 6px 15px rgba(127, 29, 29, 0.5); }
        .table-container { margin-top: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #14141c; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px 18px; font-size: 14px; }
        th { background: #181820; color: #a1a1aa; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        tr { border-bottom: 1px solid #1f1f2e; }
        tr:last-child { border-bottom: none; }
        tr:hover { background: #1b1b26; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status.active { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .status.banned { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .badge { background: #27272a; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #d4d4d8; }
        .action-btn { background: none; border: 1px solid #3f3f46; color: #a1a1aa; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.15s; margin-right: 5px; }
        .action-btn.ban { border-color: #ef4444; color: #f87171; }
        .action-btn.ban:hover { background: #ef4444; color: #fff; }
        .action-btn.del { border-color: #71717a; color: #e4e4e7; }
        .action-btn.del:hover { background: #e4e4e7; color: #000; }
        .time { font-family: monospace; color: #c084fc; }
        .hwid-text { font-family: monospace; font-size: 11px; color: #a1a1aa; max-width: 1200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">
    <h1>RAVGE <span>PREMIUM</span> CONTROL</h1>
    <div class="subtitle">Разработчик: Forthbxr | Облачная база данных Neon PostgreSQL</div>
    
    <div class="controls">
        <button class="btn" onclick="generateKey()">⚡ Сгенерировать новый 30-дней ключ</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Лицензионный Ключ</th>
                    <th>Пользователь (Логин)</th>
                    <th>HWID привязка</th>
                    <th>Сервер</th>
                    <th>Окончание подписки</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="keys-table-body">
                <!-- Строки генерируются автоматически -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadKeys() {
        try {
            const res = await fetch('/api/admin/keys');
            const data = await res.json();
            if (!data.success) return;

            const tbody = document.getElementById('keys-table-body');
            tbody.innerHTML = '';

            data.keys.forEach(item => {
                const tr = document.createElement('tr');
                
                let expiresStr = 'Не активирован';
                if (item.expires_at > 0) {
                    const date = new Date(Number(item.expires_at));
                    expiresStr = date.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                }

                // Форматируем вывод Имени и Логина игрока
                let userDisplay = item.player_name || '—';
                if (item.login) {
                    userDisplay += ` <span style="color: #a855f7; font-size: 12px;">(${item.login})</span>`;
                }

                tr.innerHTML = `
                    <td><span class="badge">#${item.id}</span></td>
                    <td style="font-weight: bold; letter-spacing: 1px; color: #fff;">${item.key}</td>
                    <td style="color: #60a5fa;">${userDisplay}</td>
                    <td><div class="hwid-text" title="${item.hwid || 'Не привязан'}">${item.hwid || '—'}</div></td>
                    <td style="color: #fbbf24;">${item.server_ip || '—'}</td>
                    <td class="time">${expiresStr}</td>
                    <td><span class="status ${item.status}">${item.status === 'active' ? 'ACTIVE' : 'BANNED'}</span></td>
                    <td>
                        <button class="action-btn ban" onclick="toggleStatus(${item.id}, '${item.status}')">${item.status === 'active' ? 'Бан' : 'Разбан'}</button>
                        <button class="action-btn del" onclick="deleteKey(${item.id})">Удалить</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error("Ошибка обновления таблицы:", e);
        }
    }

    async function generateKey() {
        const res = await fetch('/api/admin/generate-license', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timeInput: "30d" })
        });
        const data = await res.json();
        if (data.success) loadKeys();
    }

    async function toggleStatus(id, currentStatus) {
        const res = await fetch('/api/admin/toggle-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, currentStatus })
        });
        const data = await res.json();
        if (data.success) loadKeys();
    }

    async function deleteKey(id) {
        if (!confirm("Вы точно хотите полностью удалить этот ключ из базы?")) return;
        const res = await fetch('/api/admin/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (data.success) loadKeys();
    }

    loadKeys();
    setInterval(loadKeys, 3000);
</script>
</body>
</html>
